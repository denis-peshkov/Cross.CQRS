# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net
name: .NET

on:
  push:
    branches:
      - master
      - release/*
      - hotfix/*
      - dev
      - feature/*
      - fix/*
      - chore/*
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
      - release/*
      - hotfix/*
      - dev
  workflow_dispatch: # allows manual runs from the Actions tab

jobs:
  build:
    permissions: # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#defining-access-for-the-github_token-scopes
      contents: write
      id-token: write
    uses: denis-peshkov/ci-templates/.github/workflows/dotnet-reusable.yml@master
    with:
      package: 'Cross.CQRS'
      # Commas as %2C for MSBuild -p:Description (see CI property-passing rules)
      description: 'Simple .NET MediatR base Query%2C Command%2C CommandEvent and CommandEventQueueProcess behavior. RequestFilter%2C ResultFilter and Filter behaviours. Event Queue and Validation behaviors. Optional JWT license validation with pluggable product metadata (ILicenseProductInfo).'
      dotnet_versions: |
        3.1.x
        6.0.x
        7.0.x
        8.0.x
        9.0.x
        10.0.x
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      TAGTOKEN: ${{ secrets.TAGTOKEN }}
